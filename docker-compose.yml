name: telemetryflow
services:
  db:
    build:
      context: .
      dockerfile: database/Dockerfile
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Run scripts/setup.sh}
      POSTGRES_USER: ${POSTGRES_USER:?Run scripts/setup.sh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup.sh}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    mem_limit: 512m
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      HOST: 0.0.0.0
      PORT: 3001
      INGEST_INTERVAL: ${INGEST_INTERVAL:-2}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Run scripts/setup.sh}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    mem_limit: 256m
  ingestion:
    build:
      context: .
      dockerfile: ingestion/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      INGEST_INTERVAL: ${INGEST_INTERVAL:-2}
      BUFFER_LIMIT: ${BUFFER_LIMIT:-5000}
      BATCH_SIZE: ${BATCH_SIZE:-500}
      MACHINE_COUNT: ${MACHINE_COUNT:-5}
      SIMULATION_SEED: ${SIMULATION_SEED:-42}
      RETENTION_DAYS: ${RETENTION_DAYS:-7}
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped
    mem_limit: 192m
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend: { condition: service_healthy }
    restart: unless-stopped
    mem_limit: 128m
volumes:
  postgres_data:
